<!DOCTYPE html>
<html lang="id">
<head>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dramaku TV - Drama Jepang Subtitle Indonesia</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #101010;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  background: #1b1b1b;
  padding: 22px 16px;
  text-align: center;
  border-bottom: 2px solid #e63946;
}
header h1 { margin: 0 0 8px; color: #ff4757; }
header p { margin: 0; color: #ccc; }
main { padding: 18px; max-width: 1200px; margin: auto; }
input {
  width: 100%;
  padding: 13px;
  border-radius: 8px;
  border: 1px solid #444;
  background: #222;
  color: white;
  font-size: 16px;
  margin-bottom: 20px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 16px;
}
.film {
  background: #202020;
  border-radius: 8px;
  overflow: hidden;
}
.film img {
  width: 100%;
  aspect-ratio: 2 / 3;
  object-fit: cover;
  display: block;
  background: #333;
}
.film h3 { font-size: 14px; padding: 0 10px; }
.film a {
  display: block;
  margin: 10px;
  padding: 10px;
  text-align: center;
  text-decoration: none;
  background: #e63946;
  color: white;
  border-radius: 5px;
}
#kosong { color: #bbb; }
footer { text-align: center; padding: 25px; color: #aaa; }
  .item-drama-admin {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin: 12px 0;
  padding: 10px;
  background: #202020;
  border-radius: 10px;
}

.poster-admin {
  width: 90px;
  height: 125px;
  object-fit: cover;
  border-radius: 6px;
}

.info-drama-admin {
  flex: 1;
  min-width: 0;
}

.aksi-drama-admin {
  display: flex;
  justify-content: flex-end;
  gap: 6px;
  flex-wrap: wrap;
}

.aksi-drama-admin button {
  padding: 7px 10px;
  cursor: pointer;
}
</style>
</head>
<body>
<header>
  <h1>Dramaku TV</h1>
  <p>Drama Jepang Subtitle Indonesia</p>
</header>
<main>
  <input id="cari" type="search" placeholder="Cari judul drama..." aria-label="Cari judul drama">

  <select id="filterKategori" aria-label="Pilih kategori">
  <option value="">Semua Kategori</option>
  <button id="tombolProfil" type="button" hidden>👤 Profil</button>
  <div id="menuProfil" hidden>
  <button id="tombolFavoritSaya" type="button">❤️ Favorit Saya</button>
  <button id="keluarPengguna" type="button">🚪 Logout</button>
</div>

<section id="daftarFavoritSaya" hidden>
  <h2>❤️ Favorit Saya</h2>
  <div id="isiFavoritSaya"></div>
</section>
</select> 
  <button id="tombolAdmin" type="button">🔐 Admin</button>
  <section id="loginPengguna" hidden>
  <h2>Login / Daftar Pengguna</h2>
  <input id="emailPengguna" type="email" placeholder="Email kamu">
  <input id="passwordPengguna" type="password" placeholder="Password (minimal 6 karakter)">
  <button id="daftarPengguna" type="button">Daftar</button>
  <button id="masukPengguna" type="button">Login</button>
  <button id="keluarPengguna" type="button" hidden>Logout</button>
  <p id="pesanPengguna"></p>
</section>
  <section id="loginAdmin" hidden>
  <h2>Login Admin</h2>
  <input id="emailAdmin" type="email" placeholder="Email admin">
  <input id="passwordAdmin" type="password" placeholder="Password admin">
  <button id="masukAdmin" type="button">Masuk</button>
  <p id="pesanAdmin"></p>
</section>
  <section id="panelAdmin" hidden>
  <h2>Panel Admin Dramaku TV</h2>
  <p>Login admin berhasil.</p>
 <div style="text-align: right; margin-bottom: 15px;">
  <button id="logoutAdmin" type="button">Logout</button>
</div>

  <label>Judul drama</label>
  <input id="judulBaru" type="text" placeholder="Masukkan judul drama">


  <label>URL poster</label>
  <input id="posterBaru" type="url" placeholder="URL poster (opsional)">

  <label>Atau unggah poster dari komputer</label>
  <input id="filePoster" type="file" accept="image/*">


  <label>Kategori</label>
  <input id="kategoriBaru" type="text" placeholder="Drama Jepang">

  <label>Link tontonan</label>
  <input id="linkBaru" type="url" placeholder="Tempel link tontonan">

  <button id="tambahDrama" type="button">Tambah Drama</button>
  <p id="pesanPanel"></p>
    <hr>
<h3>Kelola Drama</h3>
<div id="daftarDramaAdmin"></div>
</section>
  <div class="grid" id="daftar"></div>
  <p id="kosong" hidden>Drama tidak ditemukan.</p>
</main>
<footer>© Dramaku TV</footer>
<script>
const film = [
  {
    judul: "Seorang Guru Perempuan yang Menghadapi Murid Nakal",
    poster: "poster1.jpg",
    link: "https://1024terabox.com/s/1FPYrN4UNJehdBbMB6mwcyg"
  }
];

const daftar = document.getElementById("daftar");
const cari = document.getElementById("cari");
const kosong = document.getElementById("kosong");

function tampilkan() {
  const kata = cari.value.toLowerCase();
  const kategoriDipilih = document.getElementById("filterKategori").value;


let hasil = film.filter(f => {
  const judulCocok = (f.judul || "")
    .toLowerCase()
    .includes(kata);

  const kategoriCocok =
    kategoriDipilih === "" ||
    kategoriDipilih === "__terbaru__" ||
    kategoriDipilih === "__favorit__" ||
    (f.kategori || "").trim().toLowerCase() ===
    kategoriDipilih.trim().toLowerCase();

  return judulCocok && kategoriCocok;
});

if (kategoriDipilih === "__terbaru__") {
  hasil.sort((a, b) =>
    new Date(b.created_at || 0) - new Date(a.created_at || 0)
  );
}
  
daftar.innerHTML = hasil.map(f => `
  <article class="film">
    <img src="${f.poster || 'https://placehold.co/300x450/252525/ffffff?text=Poster'}" alt="Poster ${f.judul}">
    <h3>${f.judul}</h3>
    <a href="${f.link || '#'}" target="_blank" rel="noopener">Tonton / Info</a>
    <button class="btn-favorit" onclick="toggleFavorit(${f.id})">
      ❤️ Favorit
    </button>
  </article>
`).join("");

  kosong.hidden = hasil.length !== 0;
}
cari.addEventListener("input", tampilkan);
  
  document.getElementById("filterKategori")
  .addEventListener("change", tampilkan);
  
tampilkan();
  async function toggleFavorit(dramaId) {
  const { data: { user }, error } =
    await klienPengguna.auth.getUser();

  if (error || !user) {
    alert("Silakan login atau daftar akun terlebih dahulu.");
    const formLogin = document.getElementById("loginPengguna");
    formLogin.hidden = false;
    formLogin.scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }

  const { data: favorit, error: cekError } =
    await klienPengguna
      .from("favorites")
      .select("id")
      .eq("user_id", user.id)
      .eq("drama_id", dramaId)
      .maybeSingle();

  if (cekError) {
    alert("Gagal memeriksa Favorit.");
    return;
  }

  if (favorit) {
    const { error: hapusError } =
      await klienPengguna
        .from("favorites")
        .delete()
        .eq("id", favorit.id);

    if (hapusError) {
      alert("Gagal menghapus Favorit.");
      return;
    }

    alert("Drama dihapus dari Favorit.");
  } else {
    const { error: tambahError } =
      await klienPengguna
        .from("favorites")
        .insert({
          user_id: user.id,
          drama_id: dramaId
        });

    if (tambahError) {
      alert("Gagal menyimpan Favorit.");
      return;
    }

    alert("Drama berhasil ditambahkan ke Favorit ❤️");
  }
}

  async function ambilDramaSupabase() {
  const SUPABASE_URL = "https://wizpznrhbmbfpajpaexf.supabase.co";
  const SUPABASE_KEY = "sb_publishable_u2MHJvGkthIN0fULeAlDzQ_Zgnsg9Ap";

  try {
    const respons = await fetch(
    `${SUPABASE_URL}/rest/v1/drama?select=*&order=created_at.desc`,
      {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    if (!respons.ok) {
      throw new Error("Gagal mengambil data drama");
    }

    const dataDrama = await respons.json();
    console.log("Data drama dari Supabase:", dataDrama);

film.length = 0;

dataDrama.forEach(d => {
film.push({
  id: d.id,
  judul: d.judul,
  created_at: d.created_at,
  poster: d.poster_url,
  link: d.link_tonton,
  kategori: d.kategori
});
});
    const pilihanKategori = document.getElementById("filterKategori");
const kategoriAktif = pilihanKategori.value;
    

pilihanKategori.innerHTML = `
  <option value="">Semua Kategori</option>
  <option value="__terbaru__">Drama Terbaru</option>
  <option value="__favorit__">Drama Terfavorit</option>
`;

const semuaKategori = [...new Set(
  film.map(f => f.kategori).filter(k => k && k.trim() !== "")
)].sort();

semuaKategori.forEach(kategori => {
  const opsi = document.createElement("option");
  opsi.value = kategori;
  opsi.textContent = kategori;
  pilihanKategori.appendChild(opsi);
});

tampilkan();
    console.log("Isi film setelah dimuat:", film);
    console.log("Filter kategori terbaru aktif");
    
  } catch (error) {
    console.error(error);
  }
}

ambilDramaSupabase();
  
const klienAdmin = window.supabase.createClient(
  "https://wizpznrhbmbfpajpaexf.supabase.co",
  "sb_publishable_u2MHJvGkthIN0fULeAlDzQ_Zgnsg9Ap"
);
const klienPengguna = window.supabase.createClient(
  "https://wizpznrhbmbfpajpaexf.supabase.co",
  "sb_publishable_u2MHJvGkthIN0fULeAlDzQ_Zgnsg9Ap",
  {
    auth: {
      storageKey: "dramaku-pengguna-auth",
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  }
);
  
document.getElementById("tombolAdmin").onclick = () => {
  const form = document.getElementById("loginAdmin");
  form.hidden = !form.hidden;
};

document.getElementById("masukAdmin").onclick = async () => {
  const pesan = document.getElementById("pesanAdmin");
  pesan.textContent = "Memeriksa akun...";

  const { data, error } = await klienAdmin.auth.signInWithPassword({
    email: document.getElementById("emailAdmin").value,
    password: document.getElementById("passwordAdmin").value
  });

  if (error) {
    pesan.textContent = "Login gagal. Periksa email dan password.";
    return;
  }

  const { data: admin, error: errorAdmin } = await klienAdmin
    .from("admin_users")
    .select("user_id")
    .eq("user_id", data.user.id)
    .maybeSingle();

  if (errorAdmin || !admin) {
    await klienAdmin.auth.signOut();
    pesan.textContent = "Akun ini tidak terdaftar sebagai admin.";
    return;
  }

pesan.textContent = "Login admin berhasil!";
document.getElementById("loginAdmin").hidden = true;
document.getElementById("panelAdmin").hidden = false;
tampilkanDaftarDramaAdmin();
};

  async function perbaruiProfilPengguna() {
    document.getElementById("tombolProfil").onclick = () => {
  const menu = document.getElementById("menuProfil");
    menu.hidden = !menu.hidden;
};
  const { data: { session } } =
    await klienPengguna.auth.getSession();

  const tombolProfil = document.getElementById("tombolProfil");
  const menuProfil = document.getElementById("menuProfil");

  tombolProfil.hidden = !session;

  if (!session) {
    menuProfil.hidden = true;
  }
}

klienPengguna.auth.onAuthStateChange(() => {
  setTimeout(perbaruiProfilPengguna, 0);
});

perbaruiProfilPengguna();
  
  document.getElementById("daftarPengguna").onclick = async () => {
  const pesan = document.getElementById("pesanPengguna");
  pesan.textContent = "Memproses pendaftaran...";

  const { data, error } = await klienPengguna.auth.signUp({
    email: document.getElementById("emailPengguna").value.trim(),
    password: document.getElementById("passwordPengguna").value
  });

  if (error) {
    pesan.textContent = "Pendaftaran gagal: " + error.message;
    return;
  }

  pesan.textContent = data.session
    ? "Pendaftaran berhasil! Kamu sudah login."
    : "Pendaftaran berhasil. Periksa email untuk konfirmasi.";
};

document.getElementById("masukPengguna").onclick = async () => {
  const pesan = document.getElementById("pesanPengguna");
  pesan.textContent = "Memeriksa akun...";

  const { error } = await klienPengguna.auth.signInWithPassword({
    email: document.getElementById("emailPengguna").value.trim(),
    password: document.getElementById("passwordPengguna").value
  });

  if (error) {
    pesan.textContent = "Login gagal: " + error.message;
    return;
  }

  document.getElementById("loginPengguna").hidden = true;
  alert("Login pengguna berhasil!");
};

document.getElementById("keluarPengguna").onclick = async () => {
  const { error } = await klienPengguna.auth.signOut();

  if (error) {
    alert("Logout gagal.");
    return;
  }

  alert("Kamu sudah logout.");
};
  
document.getElementById("tambahDrama").onclick = async () => {
  const pesan = document.getElementById("pesanPanel");
  pesan.textContent = "Menyimpan drama...";

  const judul = document.getElementById("judulBaru").value.trim();
  const file = document.getElementById("filePoster").files[0];
  let posterUrl = document.getElementById("posterBaru").value.trim();

  if (!judul) {
    pesan.textContent = "Judul drama wajib diisi.";
    return;
  }

  if (file) {
    if (!file.type.startsWith("image/")) {
      pesan.textContent = "Pilih file gambar.";
      return;
    }

    const namaFile = Date.now() + "-" +
      file.name.replace(/[^a-zA-Z0-9._-]/g, "_");

    pesan.textContent = "Mengunggah poster...";

    const { error: errorUpload } = await klienAdmin.storage
      .from("Poster Drama")
      .upload(namaFile, file);

    if (errorUpload) {
      pesan.textContent = "Gagal mengunggah poster.";
      console.error(errorUpload);
      return;
    }

    const { data: urlPoster } = klienAdmin.storage
      .from("Poster Drama")
      .getPublicUrl(namaFile);

    posterUrl = urlPoster.publicUrl;
  }

  const { error } = await klienAdmin.from("drama").insert({
    judul: judul,
    poster_url: posterUrl || null,
    kategori: document.getElementById("kategoriBaru").value.trim() || null,
    link_tonton: document.getElementById("linkBaru").value.trim() || null
  });

  if (error) {
    pesan.textContent = "Gagal menyimpan drama.";
    console.error(error);
    return;
  }

  pesan.textContent = "Drama berhasil ditambahkan!";

  document.getElementById("judulBaru").value = "";
  document.getElementById("posterBaru").value = "";
  document.getElementById("filePoster").value = "";
  document.getElementById("kategoriBaru").value = "";
  document.getElementById("linkBaru").value = "";

  ambilDramaSupabase();
  tampilkanDaftarDramaAdmin();
};
  document.getElementById("logoutAdmin").onclick = async () => {
  const { error } = await klienAdmin.auth.signOut();

  if (error) {
    alert("Gagal logout. Silakan coba lagi.");
    return;
  }

  document.getElementById("panelAdmin").hidden = true;
  document.getElementById("loginAdmin").hidden = true;

  document.getElementById("pesanAdmin").textContent = "";
  document.getElementById("emailAdmin").value = "";
  document.getElementById("passwordAdmin").value = "";
    
  await ambilDramaSupabase();
    document.getElementById("panelAdmin").hidden = true;
    document.getElementById("loginAdmin").hidden = true;
    tampilkan();
    window.scrollTo(0, 0);
      alert("Berhasil logout. Kamu kembali ke halaman utama.");
};
  
async function tampilkanDaftarDramaAdmin() {
  const daftar = document.getElementById("daftarDramaAdmin");
  daftar.textContent = "Memuat daftar drama...";

  const { data, error } = await klienAdmin
    .from("drama")
   .select("id, judul, poster_url, kategori, link_tonton")
    .order("id", { ascending: true });

  if (error) {
    daftar.textContent = "Gagal memuat daftar drama.";
    console.error(error);
    return;
  }

  daftar.innerHTML = "";

  data.forEach((drama) => {
    const baris = document.createElement("div");
    baris.className = "item-drama-admin";

    const poster = document.createElement("img");
    poster.className = "poster-admin";
    poster.src = drama.poster_url || "";
    poster.alt = drama.judul;

    const info = document.createElement("div");
    info.className = "info-drama-admin";

    const judul = document.createElement("span");
    const tombolEdit = document.createElement("button");
    const tombol = document.createElement("button");

    judul.textContent = drama.judul + " ";

tombolEdit.textContent = "Edit";
tombolEdit.type = "button";

tombolEdit.onclick = async () => {
  const { data, error } = await klienAdmin
    .from("drama")
    .select("id, judul, poster_url, kategori, link_tonton")
    .eq("id", drama.id)
    .single();

  if (error) {
    alert("Gagal mengambil data drama.");
    return;
  }

  const judulBaru = prompt("Judul drama:", data.judul);
  if (judulBaru === null || !judulBaru.trim()) return;

  const posterBaru = prompt("URL poster:", data.poster_url || "");
  if (posterBaru === null) return;

  const kategoriBaru = prompt("Kategori:", data.kategori || "");
  if (kategoriBaru === null) return;

  const linkBaru = prompt("Link tontonan:", data.link_tonton || "");
  if (linkBaru === null) return;

  const { error: errorEdit } = await klienAdmin
    .from("drama")
    .update({
      judul: judulBaru.trim(),
      poster_url: posterBaru.trim() || null,
      kategori: kategoriBaru.trim() || null,
      link_tonton: linkBaru.trim() || null
    })
    .eq("id", drama.id);

  if (errorEdit) {
    alert("Gagal mengedit drama.");
    console.error(errorEdit);
    return;
  }

  alert("Drama berhasil diperbarui.");
  tampilkanDaftarDramaAdmin();
  ambilDramaSupabase();
};

tombol.textContent = "Hapus";
tombol.type = "button";
    
    tombol.onclick = async () => {
      if (!confirm('Yakin ingin menghapus "' + drama.judul + '"?')) return;

      const { error: errorHapus } = await klienAdmin
        .from("drama")
        .delete()
        .eq("id", drama.id);

      if (errorHapus) {
        alert("Gagal menghapus drama. Periksa izin database.");
        console.error(errorHapus);
        return;
      }

      alert("Drama berhasil dihapus.");
      tampilkanDaftarDramaAdmin();
      ambilDramaSupabase();
    };

   info.appendChild(judul);

      const aksi = document.createElement("div");
      aksi.className = "aksi-drama-admin";
      aksi.appendChild(tombolEdit);
      aksi.appendChild(tombol);

      info.appendChild(aksi);
      baris.appendChild(poster);
      baris.appendChild(info);
      daftar.appendChild(baris);
  });
}

</script>
</body>
</html>
