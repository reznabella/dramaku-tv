
<!DOCTYPE html>
<html lang="id">
<head>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dramaku TV - Drama Jepang Subtitle Indonesia</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #101010;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  background: #1b1b1b;
  padding: 22px 16px;
  text-align: center;
  border-bottom: 2px solid #e63946;
}
header h1 { margin: 0 0 8px; color: #ff4757; }
header p { margin: 0; color: #ccc; }
main { padding: 18px; max-width: 1200px; margin: auto; }
input {
  width: 100%;
  padding: 13px;
  border-radius: 8px;
  border: 1px solid #444;
  background: #222;
  color: white;
  font-size: 16px;
  margin-bottom: 20px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 16px;
}
.film {
  background: #202020;
  border-radius: 8px;
  overflow: hidden;
}
.film img {
  width: 100%;
  aspect-ratio: 2 / 3;
  object-fit: cover;
  display: block;
  background: #333;
}
.film h3 { font-size: 14px; padding: 0 10px; }
.film a {
  display: block;
  margin: 10px;
  padding: 10px;
  text-align: center;
  text-decoration: none;
  background: #e63946;
  color: white;
  border-radius: 5px;
}
#kosong { color: #bbb; }
footer { text-align: center; padding: 25px; color: #aaa; }
  .item-drama-admin {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin: 12px 0;
  padding: 10px;
  background: #202020;
  border-radius: 10px;
}

.poster-admin {
  width: 90px;
  height: 125px;
  object-fit: cover;
  border-radius: 6px;
}

.info-drama-admin {
  flex: 1;
  min-width: 0;
}

.aksi-drama-admin {
  display: flex;
  justify-content: flex-end;
  gap: 6px;
  flex-wrap: wrap;
}

.aksi-drama-admin button {
  padding: 7px 10px;
  cursor: pointer;
}
</style>
</head>
<body>
<header>
  <h1>Dramaku TV</h1>
  <p>Drama Jepang Subtitle Indonesia</p>
</header>
<main>
  <input id="cari" type="search" placeholder="Cari judul drama..." aria-label="Cari judul drama">
  <button id="tombolAdmin" type="button">🔐 Admin</button>
  <section id="loginAdmin" hidden>
  <h2>Login Admin</h2>
  <input id="emailAdmin" type="email" placeholder="Email admin">
  <input id="passwordAdmin" type="password" placeholder="Password admin">
  <button id="masukAdmin" type="button">Masuk</button>
  <p id="pesanAdmin"></p>
</section>
  <section id="panelAdmin" hidden>
  <h2>Panel Admin Dramaku TV</h2>
  <p>Login admin berhasil.</p>
 <div style="text-align: right; margin-bottom: 15px;">
  <button id="logoutAdmin" type="button">Logout</button>
</div>

  <label>Judul drama</label>
  <input id="judulBaru" type="text" placeholder="Masukkan judul drama">


  <label>URL poster</label>
  <input id="posterBaru" type="url" placeholder="URL poster (opsional)">

  <label>Atau unggah poster dari komputer</label>
  <input id="filePoster" type="file" accept="image/*">


  <label>Kategori</label>
  <input id="kategoriBaru" type="text" placeholder="Drama Jepang">

  <label>Link tontonan</label>
  <input id="linkBaru" type="url" placeholder="Tempel link tontonan">

  <button id="tambahDrama" type="button">Tambah Drama</button>
  <p id="pesanPanel"></p>
    <hr>
<h3>Kelola Drama</h3>
<div id="daftarDramaAdmin"></div>
</section>
  <div class="grid" id="daftar"></div>
  <p id="kosong" hidden>Drama tidak ditemukan.</p>
</main>
<footer>© Dramaku TV</footer>
<script>
const film = [
  {
    judul: "Seorang Guru Perempuan yang Menghadapi Murid Nakal",
    poster: "poster1.jpg",
    link: "https://1024terabox.com/s/1FPYrN4UNJehdBbMB6mwcyg"
  }
];

const daftar = document.getElementById("daftar");
const cari = document.getElementById("cari");
const kosong = document.getElementById("kosong");

function tampilkan() {
  const kata = cari.value.toLowerCase();
  const hasil = film.filter(f => f.judul.toLowerCase().includes(kata));
  daftar.innerHTML = hasil.map(f => `
    <article class="film">
      <img src="${f.poster || 'https://placehold.co/300x450/252525/ffffff?text=Poster'}" alt="Poster ${f.judul}">
      <h3>${f.judul}</h3>
      <a href="${f.link || '#'}" target="_blank" rel="noopener">Tonton / Info</a>
    </article>
  `).join("");
  kosong.hidden = hasil.length !== 0;
}
cari.addEventListener("input", tampilkan);
tampilkan();
  async function ambilDramaSupabase() {
  const SUPABASE_URL = "https://wizpznrhbmbfpajpaexf.supabase.co";
  const SUPABASE_KEY = "sb_publishable_u2MHJvGkthIN0fULeAlDzQ_Zgnsg9Ap";

  try {
    const respons = await fetch(
      `${SUPABASE_URL}/rest/v1/drama?select=*`,
      {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    if (!respons.ok) {
      throw new Error("Gagal mengambil data drama");
    }

    const dataDrama = await respons.json();

film.length = 0;

dataDrama.forEach(d => {
  film.push({
    judul: d.judul,
    poster: d.poster_url,
    link: d.link_tonton
  });
});

tampilkan();
  } catch (error) {
    console.error(error);
  }
}

ambilDramaSupabase();
  
const klienAdmin = window.supabase.createClient(
  "https://wizpznrhbmbfpajpaexf.supabase.co",
  "sb_publishable_u2MHJvGkthIN0fULeAlDzQ_Zgnsg9Ap"
);

document.getElementById("tombolAdmin").onclick = () => {
  const form = document.getElementById("loginAdmin");
  form.hidden = !form.hidden;
};

document.getElementById("masukAdmin").onclick = async () => {
  const pesan = document.getElementById("pesanAdmin");
  pesan.textContent = "Memeriksa akun...";

  const { data, error } = await klienAdmin.auth.signInWithPassword({
    email: document.getElementById("emailAdmin").value,
    password: document.getElementById("passwordAdmin").value
  });

  if (error) {
    pesan.textContent = "Login gagal. Periksa email dan password.";
    return;
  }

  const { data: admin, error: errorAdmin } = await klienAdmin
    .from("admin_users")
    .select("user_id")
    .eq("user_id", data.user.id)
    .maybeSingle();

  if (errorAdmin || !admin) {
    await klienAdmin.auth.signOut();
    pesan.textContent = "Akun ini tidak terdaftar sebagai admin.";
    return;
  }

pesan.textContent = "Login admin berhasil!";
document.getElementById("loginAdmin").hidden = true;
document.getElementById("panelAdmin").hidden = false;
tampilkanDaftarDramaAdmin();
};

document.getElementById("tambahDrama").onclick = async () => {
  const pesan = document.getElementById("pesanPanel");
  pesan.textContent = "Menyimpan drama...";

  const judul = document.getElementById("judulBaru").value.trim();
  const file = document.getElementById("filePoster").files[0];
  let posterUrl = document.getElementById("posterBaru").value.trim();

  if (!judul) {
    pesan.textContent = "Judul drama wajib diisi.";
    return;
  }

  if (file) {
    if (!file.type.startsWith("image/")) {
      pesan.textContent = "Pilih file gambar.";
      return;
    }

    const namaFile = Date.now() + "-" +
      file.name.replace(/[^a-zA-Z0-9._-]/g, "_");

    pesan.textContent = "Mengunggah poster...";

    const { error: errorUpload } = await klienAdmin.storage
      .from("Poster Drama")
      .upload(namaFile, file);

    if (errorUpload) {
      pesan.textContent = "Gagal mengunggah poster.";
      console.error(errorUpload);
      return;
    }

    const { data: urlPoster } = klienAdmin.storage
      .from("Poster Drama")
      .getPublicUrl(namaFile);

    posterUrl = urlPoster.publicUrl;
  }

  const { error } = await klienAdmin.from("drama").insert({
    judul: judul,
    poster_url: posterUrl || null,
    kategori: document.getElementById("kategoriBaru").value.trim() || null,
    link_tonton: document.getElementById("linkBaru").value.trim() || null
  });

  if (error) {
    pesan.textContent = "Gagal menyimpan drama.";
    console.error(error);
    return;
  }

  pesan.textContent = "Drama berhasil ditambahkan!";

  document.getElementById("judulBaru").value = "";
  document.getElementById("posterBaru").value = "";
  document.getElementById("filePoster").value = "";
  document.getElementById("kategoriBaru").value = "";
  document.getElementById("linkBaru").value = "";

  ambilDramaSupabase();
  tampilkanDaftarDramaAdmin();
};
  document.getElementById("logoutAdmin").onclick = async () => {
  const { error } = await klienAdmin.auth.signOut();

  if (error) {
    alert("Gagal logout. Silakan coba lagi.");
    return;
  }

  document.getElementById("panelAdmin").hidden = true;
  document.getElementById("loginAdmin").hidden = true;

  document.getElementById("pesanAdmin").textContent = "";
  document.getElementById("emailAdmin").value = "";
  document.getElementById("passwordAdmin").value = "";

  window.scrollTo(0, 0);
  alert("Berhasil logout. Kamu kembali ke halaman utama.");
};
  
async function tampilkanDaftarDramaAdmin() {
  const daftar = document.getElementById("daftarDramaAdmin");
  daftar.textContent = "Memuat daftar drama...";

  const { data, error } = await klienAdmin
    .from("drama")
   .select("id, judul, poster_url, kategori, link_tonton")
    .order("id", { ascending: true });

  if (error) {
    daftar.textContent = "Gagal memuat daftar drama.";
    console.error(error);
    return;
  }

  daftar.innerHTML = "";

  data.forEach((drama) => {
    const baris = document.createElement("div");
    baris.className = "item-drama-admin";

    const poster = document.createElement("img");
    poster.className = "poster-admin";
    poster.src = drama.poster_url || "";
    poster.alt = drama.judul;

    const info = document.createElement("div");
    info.className = "info-drama-admin";

    const judul = document.createElement("span");
    const tombolEdit = document.createElement("button");
    const tombol = document.createElement("button");

    judul.textContent = drama.judul + " ";

tombolEdit.textContent = "Edit";
tombolEdit.type = "button";

tombolEdit.onclick = async () => {
  const { data, error } = await klienAdmin
    .from("drama")
    .select("id, judul, poster_url, kategori, link_tonton")
    .eq("id", drama.id)
    .single();

  if (error) {
    alert("Gagal mengambil data drama.");
    return;
  }

  const judulBaru = prompt("Judul drama:", data.judul);
  if (judulBaru === null || !judulBaru.trim()) return;

  const posterBaru = prompt("URL poster:", data.poster_url || "");
  if (posterBaru === null) return;

  const kategoriBaru = prompt("Kategori:", data.kategori || "");
  if (kategoriBaru === null) return;

  const linkBaru = prompt("Link tontonan:", data.link_tonton || "");
  if (linkBaru === null) return;

  const { error: errorEdit } = await klienAdmin
    .from("drama")
    .update({
      judul: judulBaru.trim(),
      poster_url: posterBaru.trim() || null,
      kategori: kategoriBaru.trim() || null,
      link_tonton: linkBaru.trim() || null
    })
    .eq("id", drama.id);

  if (errorEdit) {
    alert("Gagal mengedit drama.");
    console.error(errorEdit);
    return;
  }

  alert("Drama berhasil diperbarui.");
  tampilkanDaftarDramaAdmin();
  ambilDramaSupabase();
};

tombol.textContent = "Hapus";
tombol.type = "button";
    
    tombol.onclick = async () => {
      if (!confirm('Yakin ingin menghapus "' + drama.judul + '"?')) return;

      const { error: errorHapus } = await klienAdmin
        .from("drama")
        .delete()
        .eq("id", drama.id);

      if (errorHapus) {
        alert("Gagal menghapus drama. Periksa izin database.");
        console.error(errorHapus);
        return;
      }

      alert("Drama berhasil dihapus.");
      tampilkanDaftarDramaAdmin();
      ambilDramaSupabase();
    };

   info.appendChild(judul);

      const aksi = document.createElement("div");
      aksi.className = "aksi-drama-admin";
      aksi.appendChild(tombolEdit);
      aksi.appendChild(tombol);

      info.appendChild(aksi);
      baris.appendChild(poster);
      baris.appendChild(info);
      daftar.appendChild(baris);
  });
}

</script>
</body>
</html>
